name: Bodi - Voix Homme Garantie SANS 503

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme'
        required: false
        default: 'Le manager qui te fait douter de toi'

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1 - Script + Audio HOMME garanti
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THEME_INPUT: ${{ inputs.theme }}
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q ffmpeg
          pip install -q google-genai edge-tts
          mkdir -p inputs outputs

          # 1a - Script avec gemini flash (pas TTS, donc pas de 503)
          python - << 'PY'
          import os
          from google import genai
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          theme = os.environ.get("THEME_INPUT","manager toxique")
          r = client.models.generate_content(model="gemini-3.8-flash", contents=f"Ecris 70s, 160 mots, francais oral sur {theme}. Hook + 3 signes + validation + conseil concret. Phrases courtes.")
          script = r.text.strip()
          open("script_du_jour.txt","w",encoding="utf-8").write(script)
          print(f"SCRIPT OK: {script[:120]}...")
          PY

          # 1b - Audio HOMME avec fallback automatique, ne plante JAMAIS avec exit 1
          python - << 'PY'
          import asyncio, os

          async def gen_audio():
              text = open("script_du_jour.txt",encoding="utf-8").read()
              # On tente Gemini 1 seule fois, si 503 on bascule direct
              try:
                  from google import genai
                  from google.genai import types
                  client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
                  print("Tentative Gemini Charon HOMME...")
                  resp = client.models.generate_content(
                      model="gemini-3.8-flash-lite-tts",
                      contents=text,
                      config=types.GenerateContentConfig(
                          response_modalities=["AUDIO"],
                          speech_config=types.SpeechConfig(
                              voice_config=types.VoiceConfig(
                                  prebuilt_voice_config=types.PrebuiltVoiceConfig(voice_name="Charon")
                              )
                          )
                      )
                  )
                  open("inputs/audio.wav","wb").write(resp.candidates[0].content.parts[0].inline_data.data)
                  print("✅ Audio Gemini Charon OK")
                  return
              except Exception as e:
                  print(f"Gemini 503 surcharge -> {e}")
                  print("Bascule vers voix HOMME Edge-TTS (fr-FR-HenriNeural) qui ne fait jamais 503...")

              # FALLBACK GARANTI HOMME
              import edge_tts
              # Henri = homme francais mature, Remy = homme jeune
              voice = "fr-FR-HenriNeural"
              communicate = edge_tts.Communicate(text, voice)
              await communicate.save("inputs/audio.wav")
              print(f"✅ Audio HOMME Edge-TTS {voice} OK")

          asyncio.run(gen_audio())
          PY

          ls -lh inputs/audio.wav
          ffprobe -v error -show_entries stream=duration -of default=noprint_wrappers=1 inputs/audio.wav

      - name: 2 - Video finale avec NOUVELLE voix homme (supprime ancienne)
        run: |
          # -an supprime DEFINITIVEMENT ta voix d'origine
          ffmpeg -y -stream_loop 10 -i inputs/video.mp4 -t 80 -an -c:v libx264 -pix_fmt yuv420p inputs/video_mute.mp4
          # colle nouvelle voix homme
          ffmpeg -y -i inputs/video_mute.mp4 -i inputs/audio.wav -c:v copy -c:a aac -shortest outputs/final.mp4
          ls -lh outputs/final.mp4
          echo "✅ Video avec voix HOMME, sans ton ancienne voix"

          # Lip-sync optionnel (ne fait plus planter)
          pip install -q gradio_client || true
          python - << 'PY' || true
          from gradio_client import Client, handle_file
          import shutil
          try:
              client = Client("AIGODLIKE-COM/Wav2Lip")
              result = client.predict(handle_file("inputs/video_mute.mp4"), handle_file("inputs/audio.wav"))
              out = result[0] if isinstance(result, list) else result
              if isinstance(out, dict): out = out.get("video")
              shutil.copy(out, "outputs/final_lipsync.mp4")
              print("✅ Lip-sync OK")
          except Exception as e:
              print(f"Lip-sync off, mais final.mp4 a deja la voix homme: {e}")
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: video-bodi-homme-fixe
          path: |
            outputs/
            script_du_jour.txt
            inputs/audio.wav
