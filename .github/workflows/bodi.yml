name: Bodi - Homme + Lip-sync Final

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme'
        required: false
        default: 'Le manager qui te fait douter de toi'

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1 - Audio voix HOMME avec 3.8-flash-tts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THEME_INPUT: ${{ inputs.theme }}
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q ffmpeg
          pip install -q google-genai
          mkdir -p inputs outputs
          python - << 'PY'
          import os, time
          from google import genai
          from google.genai import types
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          theme = os.environ.get("THEME_INPUT","manager toxique")
          prompt = f"Ecris 65s, 155 mots, francais oral sur {theme}. Hook + 3 signes + validation + conseil concret. Phrases courtes, tutoiement."
          r = client.models.generate_content(model="gemini-3.8-flash", contents=prompt)
          script = r.text.strip()
          open("script_du_jour.txt","w",encoding="utf-8").write(script)
          print(script)
          # VOIX HOMME: Charon = homme grave, Puck = homme dynamique. Kore etait femme, c'est pour ca que tu avais voix femme
          VOICE = "Charon"
          for m in ["gemini-3.8-flash-tts","gemini-3.8-flash-lite-tts","gemini-2.5-flash-preview-tts"]:
            try:
              print(f"TTS {m} avec voix {VOICE}")
              resp = client.models.generate_content(model=m, contents=script, config=types.GenerateContentConfig(response_modalities=["AUDIO"], speech_config=types.SpeechConfig(voice_config=types.VoiceConfig(prebuilt_voice_config=types.PrebuiltVoiceConfig(voice_name=VOICE)))))
              open("inputs/audio.wav","wb").write(resp.candidates[0].content.parts[0].inline_data.data)
              print(f"✅ Audio homme OK avec {VOICE}")
              break
            except Exception as e:
              print(e); time.sleep(10)
          PY

      - name: 2 - Lip-sync + Voix homme
        run: |
          pip install -q gradio_client
          ffmpeg -y -stream_loop 10 -i inputs/video.mp4 -t 80 -c:v libx264 -pix_fmt yuv420p inputs/video_loop.mp4
          python - << 'PY'
          from gradio_client import Client, handle_file
          import shutil, os, time

          # Liste de Spaces Wav2Lip qui marchent, on essaie un par un
          spaces = ["AIGODLIKE-COM/Wav2Lip", "as-cle-bert/wav2lip", "fatchord/Wav2Lip"]
          
          success=False
          for space_id in spaces:
            try:
              print(f"Tentative lip-sync avec {space_id}...")
              client = Client(space_id)
              # La plupart des Spaces Wav2Lip ont 2 inputs: video + audio
              result = client.predict(
                  handle_file("inputs/video_loop.mp4"),
                  handle_file("inputs/audio.wav"),
              )
              print(f"Result {space_id}: {result}")
              video_out = result[0] if isinstance(result, list) else result
              if isinstance(video_out, dict):
                video_out = video_out.get("video") or video_out.get("value") or list(video_out.values())[0]
              os.makedirs("outputs", exist_ok=True)
              shutil.copy(video_out, "outputs/final.mp4")
              print(f"✅ Lip-sync OK avec {space_id}")
              success=True
              break
            except Exception as e:
              print(f"Echec {space_id}: {e}")
              time.sleep(2)
              continue
          
          if not success:
            print("Tous les Spaces HS, fallback ffmpeg sans lip-sync mais avec voix homme")
            os.system("ffmpeg -y -i inputs/video_loop.mp4 -i inputs/audio.wav -c:v copy -c:a aac -shortest outputs/final.mp4")
          PY
          ls -lh outputs/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: video-bodi-homme-lipsync
          path: |
            outputs/final.mp4
            script_du_jour.txt
