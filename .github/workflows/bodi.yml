name: Bodi - Video Auto

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme video'
        required: false
        default: 'Le manager toxique'

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Génère script + audio Bodi Tutor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THEME_INPUT: ${{ inputs.theme }}
        run: |
          pip install -q google-genai
          python scripts/generate_bodi.py

      - name: Lip-sync HD sur ton Space
        run: |
          pip install -q gradio_client huggingface_hub
          python - << 'PY'
          from gradio_client import Client
          import shutil, os
          
          print("Connexion à nailahrv/LatentSync...")
          # CORRECTION 2026: plus de hf_token
          client = Client("nailahrv/LatentSync")
          
          # Appel
          result = client.predict(
              video="inputs/video.mp4",
              audio="inputs/audio.wav",
              api_name="/predict"
          )
          print(f"Result: {result}")
          # Copie vers outputs
          os.makedirs("outputs", exist_ok=True)
          if isinstance(result, str):
              shutil.copy(result, "outputs/final.mp4")
          else:
              shutil.copy(result[0], "outputs/final.mp4")
          PY

      - name: Upload video finale
        uses: actions/upload-artifact@v4
        with:
          name: video-bodi-finale
          path: outputs/final.mp4
