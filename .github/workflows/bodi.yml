name: Bodi - Fix RemoteProtocolError

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme'
        required: false
        default: 'Le manager qui te fait douter de toi'

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1 - Audio HOMME Charon avec retry + split
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THEME_INPUT: ${{ inputs.theme }}
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q ffmpeg
          pip install -q google-genai pydub
          mkdir -p inputs outputs
          python - << 'PY'
          import os, time, re
          from google import genai
          from google.genai import types
          from pydub import AudioSegment
          import io

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          theme = os.environ.get("THEME_INPUT","manager toxique")
          
          # script un peu plus court pour eviter deconnect
          prompt = f"Ecris 70s, 160 mots max, francais oral sur {theme}. Hook + 3 signes + validation + conseil. Phrases courtes."
          r = client.models.generate_content(model="gemini-3.8-flash", contents=prompt)
          script = r.text.strip()
          open("script_du_jour.txt","w",encoding="utf-8").write(script)
          print(f"SCRIPT: {script}\n---")

          # On coupe le script en 2 moities pour eviter RemoteProtocolError
          sentences = re.split(r'(?<=[.!?])\s+', script)
          mid = len(sentences)//2
          chunks = [" ".join(sentences[:mid]), " ".join(sentences[mid:])]
          chunks = [c for c in chunks if c.strip()]
          print(f"Decoupe en {len(chunks)} morceaux")

          VOICE="Charon" # HOMME
          MODELS=["gemini-3.8-flash-tts","gemini-3.8-flash-lite-tts","gemini-2.5-flash-preview-tts"]
          
          full_audio = AudioSegment.empty()
          
          for idx, chunk in enumerate(chunks):
            print(f"\n--- Generation morceau {idx+1}/{len(chunks)}: {chunk[:60]}...")
            success=False
            for model_name in MODELS:
              for attempt in range(5):
                try:
                  print(f"  Essai {model_name} tentative {attempt+1}/5")
                  resp = client.models.generate_content(
                    model=model_name,
                    contents=chunk,
                    config=types.GenerateContentConfig(
                      response_modalities=["AUDIO"],
                      speech_config=types.SpeechConfig(
                        voice_config=types.VoiceConfig(prebuilt_voice_config=types.PrebuiltVoiceConfig(voice_name=VOICE))
                      )
                    )
                  )
                  data = resp.candidates[0].content.parts[0].inline_data.data
                  seg = AudioSegment.from_file(io.BytesIO(data))
                  full_audio += seg + AudioSegment.silent(duration=200)
                  print(f"  OK morceau {idx+1}")
                  success=True
                  break
                except Exception as e:
                  msg=str(e)
                  print(f"  Erreur: {msg[:200]}")
                  if "RemoteProtocolError" in msg or "disconnected" in msg or "503" in msg or "UNAVAILABLE" in msg:
                    print(f"  -> Serveur coupe, attente {15*(attempt+1)}s et retry...")
                    time.sleep(15*(attempt+1))
                    continue
                  elif "RESOURCE_EXHAUSTED" in msg:
                    break
                  else:
                    time.sleep(5)
              if success: break
            if not success:
              raise Exception(f"Echec total sur morceau {idx+1}")

          full_audio.export("inputs/audio.wav", format="wav")
          print(f"\n✅ Audio HOMME final {len(full_audio)/1000:.1f}s - {os.path.getsize('inputs/audio.wav')} bytes")
          PY
          ffprobe -v error -show_entries stream=duration -of default=noprint_wrappers=1 inputs/audio.wav

      - name: 2 - Video avec NOUVELLE voix homme (supprime ancienne voix)
        run: |
          # supprime ancienne voix de ta video
          ffmpeg -y -stream_loop 10 -i inputs/video.mp4 -t 80 -an -c:v libx264 -pix_fmt yuv420p inputs/video_mute.mp4
          # colle nouvelle voix homme
          ffmpeg -y -i inputs/video_mute.mp4 -i inputs/audio.wav -c:v copy -c:a aac -shortest outputs/final.mp4
          ls -lh outputs/final.mp4
          echo "✅ Video avec voix Charon HOMME, sans ancienne voix"

          # tentative lip-sync legere (optionnelle, ne fait pas planter si HS)
          pip install -q gradio_client || true
          python - << 'PY'
          try:
              from gradio_client import Client, handle_file
              import shutil
              print("Tentative lip-sync AIGODLIKE-COM/Wav2Lip...")
              client = Client("AIGODLIKE-COM/Wav2Lip")
              result = client.predict(handle_file("inputs/video_mute.mp4"), handle_file("inputs/audio.wav"))
              out = result[0] if isinstance(result, list) else result
              if isinstance(out, dict): out = out.get("video")
              shutil.copy(out, "outputs/final_lipsync.mp4")
              print("✅ Lip-sync OK")
          except Exception as e:
              print(f"Lip-sync HS, on garde final.mp4 avec voix homme: {e}")
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: video-bodi-homme-fixe
          path: |
            outputs/
            script_du_jour.txt
