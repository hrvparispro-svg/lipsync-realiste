name: Bodi - Video Auto

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme'
        required: false
        default: 'manager toxique'

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1 - Genere audio Bodi 3.8 TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THEME_INPUT: ${{ inputs.theme }}
        run: |
          pip install -q google-genai
          python scripts/generate_bodi.py

      - name: 2 - Lip-sync local (plus de Space)
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q opencv-python-headless ffmpeg-python gradio_client huggingface_hub imageio
          git clone https://github.com/bytedance/LatentSync.git
          mkdir -p LatentSync/checkpoints inputs outputs
          
          # Telecharge poids 1.5 (1.2Go)
          python - << 'PY'
          from huggingface_hub import hf_hub_download
          hf_hub_download(repo_id="ByteDance/LatentSync", filename="latentsync_1.5.pt", local_dir="LatentSync/checkpoints")
          PY
          
          # Convertit audio wav -> pour LatentSync
          ffmpeg -i inputs/audio.wav -ar 16000 inputs/audio_16k.wav -y
          
          python LatentSync/inference.py --inference_ckpt_path LatentSync/checkpoints/latentsync_1.5.pt --video_path inputs/video.mp4 --audio_path inputs/audio_16k.wav --output_path outputs/final.mp4

      - name: Upload video finale
        uses: actions/upload-artifact@v4
        with:
          name: video-bodi-finale
          path: outputs/final.mp4
