name: Bodi - Video Auto 1min

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme de la video Bodi'
        required: false
        default: 'Le manager toxique qui te fait douter'

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1 - Genere script + audio Bodi 3.8 TTS 1min
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THEME_INPUT: ${{ inputs.theme }}
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q ffmpeg
          pip install -q google-genai pydub
          python scripts/generate_bodi.py

      - name: 2 - Lip-sync local sans Space HF
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q opencv-python-headless imageio ffmpeg-python huggingface_hub
          git clone https://github.com/bytedance/LatentSync.git
          mkdir -p LatentSync/checkpoints outputs
          
          python - << 'PY'
          from huggingface_hub import hf_hub_download
          print("Telechargement poids LatentSync 1.5...")
          hf_hub_download(repo_id="ByteDance/LatentSync", filename="latentsync_1.5.pt", local_dir="LatentSync/checkpoints")
          # fix path
          import os, shutil
          src = "LatentSync/checkpoints/checkpoints/latentsync_1.5.pt"
          dst = "LatentSync/checkpoints/latentsync_1.5.pt"
          if os.path.exists(src):
              shutil.move(src, dst)
          PY
          
          # Audio 16k pour LatentSync + boucle video si ta video est trop courte
          ffmpeg -i inputs/audio.wav -ar 16000 inputs/audio_16k.wav -y
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 inputs/audio_16k.wav > dur.txt
          cat dur.txt
          # Si video.mp4 fait 10s, on la boucle pour couvrir l'audio 70s
          ffmpeg -stream_loop 10 -i inputs/video.mp4 -c copy inputs/video_loop.mp4 -y
          
          python LatentSync/inference.py \
            --inference_ckpt_path LatentSync/checkpoints/latentsync_1.5.pt \
            --video_path inputs/video_loop.mp4 \
            --audio_path inputs/audio_16k.wav \
            --output_path outputs/final.mp4

      - name: Upload video finale 1min
        uses: actions/upload-artifact@v4
        with:
          name: video-bodi-1min-finale
          path: |
            outputs/final.mp4
            script_du_jour.txt
            inputs/audio.wav
